<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121316">
  <title>FX Box</title>
  <!-- Everything is local: the box often runs as its own hotspot with no internet. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0a43b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23121316' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">FX Box</a>
    <span id="engine-badge" class="badge" title="Engine backend">…</span>
  </header>

  <main>
    <section class="now" aria-label="Now playing">
      <div class="now-row">
        <div>
          <div class="eyebrow">Now playing</div>
          <div id="now-name" class="now-name">—</div>
        </div>
        <span id="now-chip" class="chip warn" hidden>unsaved edits</span>
      </div>
      <dl id="health" class="health">
        <div class="tile" data-k="buffer"><dt>Buffer</dt><dd>—</dd></div>
        <div class="tile" data-k="latency"><dt>Latency</dt><dd>—</dd></div>
        <div class="tile" data-k="dsp"><dt>DSP</dt><dd>—</dd></div>
        <div class="tile" data-k="xruns"><dt>Xruns</dt><dd>—</dd></div>
        <div class="tile" data-k="temp"><dt>CPU</dt><dd>—</dd></div>
      </dl>
      <p id="health-note" class="note"></p>
    </section>

    <section id="view-list" class="view" hidden>
      <div class="section-head">
        <h1>Presets</h1>
        <a class="btn small ghost" href="#/new">+ New</a>
      </div>
      <ul id="preset-list" class="presets"></ul>
    </section>

    <section id="view-edit" class="view" hidden>
      <div class="section-head">
        <a class="back" href="#/">‹ Presets</a>
        <span id="edit-dirty" class="chip" hidden>edited</span>
      </div>
      <form id="edit-form" autocomplete="off" novalidate>
        <label class="field">
          <span>Name</span>
          <input id="f-name" type="text" maxlength="80" required>
        </label>
        <label class="field">
          <span>Description</span>
          <textarea id="f-desc" rows="2"></textarea>
        </label>
        <label class="field">
          <span>Buffer size <small id="f-buf-hint"></small></span>
          <select id="f-buf"></select>
        </label>

        <h2>Chain <small>signal flows top to bottom</small></h2>
        <ol id="chain" class="chain"></ol>
        <div class="add-row">
          <select id="add-effect" aria-label="Effect to add"></select>
          <button type="button" id="add-btn" class="btn ghost">Add</button>
        </div>

        <button type="button" id="delete-btn" class="btn danger ghost wide">Delete preset</button>
      </form>
      <div class="actionbar">
        <button type="button" id="try-btn" class="btn ghost" title="Play these settings without saving">Try</button>
        <button type="button" id="saveas-btn" class="btn ghost">Save as…</button>
        <button type="button" id="save-btn" class="btn primary">Save</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <template id="tpl-preset">
    <li class="preset">
      <button type="button" class="preset-main">
        <span class="preset-title"><span class="p-name"></span><span class="chip on" hidden>playing</span></span>
        <span class="p-desc"></span>
        <span class="p-meta"></span>
      </button>
      <a class="btn small ghost p-edit" href="#">Edit</a>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
