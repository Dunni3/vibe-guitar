[project]
name = "guitar-fx"
version = "0.1.0"
description = "Offline tooling for the guitar FX box: test signals and the profiling harness."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
fx-signals = "fxharness.signals:main"
fx-profile = "fxharness.profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/fxharness"]
